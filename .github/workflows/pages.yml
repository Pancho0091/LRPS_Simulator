name: Deploy to GitHub Pages

on:
  push:
    branches: [main, ccr-9241156f-dtlya7]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test solver
        run: npm test
      - name: Stage site
        run: |
          mkdir _site
          cp -r index.html css js _site/
          # Cache-bust every stylesheet and script with the commit, so a fresh page never runs stale assets
          sed -i -E "s#(href|src)=\"(css|js)/([^\"]+)\.(css|js)\"#\1=\"\2/\3.\4?v=${GITHUB_SHA::8}\"#g" _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
