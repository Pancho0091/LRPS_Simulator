name: Deploy to GitHub Pages

on:
  push:
    branches: [main, ccr-9241156f-dtlya7]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test solver
        run: npm test
      - name: Stage site
        # Same script the offline test uses: copies the shipped files, cache-busts css/js with the
        # commit, and writes the service worker's precache list and release version
        run: node scripts/stage.mjs _site "${GITHUB_SHA::8}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
